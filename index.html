<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- PWA（iOS/Safari向け） -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyApp" />

  <link rel="manifest" href="manifest.json">

  <style>
    :root{
      /* ヘッダー高さ（必要なら調整） */
      --header-h: 60px;

      /* Safe Area */
      --sat: env(safe-area-inset-top);
      --sab: env(safe-area-inset-bottom);
      --sal: env(safe-area-inset-left);
      --sar: env(safe-area-inset-right);
    }

    html, body {
      height: 100%;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
    }

    /* ✅ ページ全体はスクロールさせない（画像エリアだけスクロール） */
    body {
      overflow: hidden;
    }

    .app {
      /* ✅ iOSのアドレスバー高さ変動に強い */
      height: 100dvh;
      padding-top: var(--sat);
      padding-bottom: var(--sab);
      padding-left: var(--sal);
      padding-right: var(--sar);
      box-sizing: border-box;

      display: flex;
      flex-direction: column;
    }
    
    header {
      height: var(--header-h);
      flex: 0 0 auto;

      /*position: relative;   */       /* ★超重要：absoluteの基準をheaderにする */
      display: flex;
      align-items: center;

      /* ✅ 右端画像のためのパディング（被り防止） */
      padding: 0 16px;

      background: #fff;
      /*border-bottom: 1px solid #ddd;*/
      box-sizing: border-box;
    }

    /* ✅ 中央寄せタイトル（常に画面中央） */
    header .title {
      position: absolute;
      /*justify-content: center; */
      left: 50%;
      transform: translateX(-50%);

      font-weight: 700;
      font-size: 16px;
      white-space: nowrap;
    }

    /* ✅ 右寄せ画像 */
    header .header-icon {
      position: absolute;          /* ★右寄せはabsoluteが堅い */
      right: 10px;
      width: 35px;                 /* 好きなサイズに */
      height: 35px;
      object-fit: contain;

      /* 見た目調整 */
      opacity: 0.95;
    }


    /* ✅ 画像表示エリア（ここだけスクロール） */
    .scroll-area {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;

      /* ✅ iOSで“慣性＋弾む”スクロールを出しやすい */
      -webkit-overflow-scrolling: touch;

      /* スクロール時の見た目 */
      background: #fff;
    }

    /* 画像を横幅にフィット */
    .scroll-area img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      
      <span class="title">メンバーシップ</span>

      <!-- ✅ 右寄せ画像（アイコン） -->
      <img class="header-icon" src="CancelButton.jpeg" alt="バツ印" />

    </header>

    <div class="scroll-area" role="region" aria-label="画像スクロール領域">
      <img src="long_image.jpeg">
    </div>
  </div>
</body>
</html>
